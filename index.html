<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Streaming App</title>
  <style>
    body { background: #121212; color: white; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { padding: 20px; text-align: center; background: #1f1f1f; }
    .movies { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
    .movie { width: 200px; background: #1f1f1f; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.7); }
    .movie img { width: 100%; height: 300px; object-fit: cover; }
    .movie h3 { padding: 10px; font-size: 18px; text-align: center; }
  </style>
</head>
<body>

  <header>Now Playing Movies</header>
  <div class="movies" id="movies"></div>

  <script>
    const API_KEY = 'YOUR_TMDB_API_KEY_HERE'; // ← Replace with your TMDb API key
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    // API endpoint for “Now Playing” movies
    const NOW_PLAYING_URL = `${BASE_URL}/movie/now_playing?api_key=${API_KEY}&language=en-US&page=1`;

    async function fetchMovies() {
      try {
        const response = await fetch(NOW_PLAYING_URL);
        const data = await response.json();
        return data.results;  // this is an array of movie objects
      } catch (err) {
        console.error('Error fetching movies:', err);
        return [];
      }
    }

    function displayMovies(movies) {
      const moviesContainer = document.getElementById('movies');
      moviesContainer.innerHTML = '';

      movies.forEach(movie => {
        const movieEl = document.createElement('div');
        movieEl.className = 'movie';

        const posterPath = movie.poster_path
          ? `${IMAGE_BASE_URL}${movie.poster_path}`
          : 'https://via.placeholder.com/200x300?text=No+Image';

        movieEl.innerHTML = `
          <img src="${posterPath}" alt="${movie.title}" />
          <h3>${movie.title}</h3>
        `;

        moviesContainer.appendChild(movieEl);
      });
    }

    // Main flow
    (async function() {
      const movies = await fetchMovies();
      displayMovies(movies);
    })();
  </script>

</body>
</html>
