<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Movie App</title>
  <link rel="stylesheet" href="/custom-movie-app/styles.css">
</head>
<body>

<header>
  <h1>Custom Movie App 🎬</h1>
  <nav>
    <button id="nowPlayingBtn" class="active">Now Playing</button>
    <button id="popularBtn">Popular</button>
  </nav>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search movies...">
    <button id="searchBtn">Search</button>
  </div>
</header>

<main>
  <div id="movies" class="movies"></div>
</main>

<!-- Movie Details Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="closeModal">&times;</span>
    <img id="modalPoster" src="" alt="">
    <h2 id="modalTitle"></h2>
    <p id="modalOverview"></p>
    <p><strong>Release Date:</strong> <span id="modalDate"></span></p>
    <p><strong>Rating:</strong> <span id="modalRating"></span>/10</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
